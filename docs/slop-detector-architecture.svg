<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1090" viewBox="0 0 1500 1090" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arrowDash" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="1090" fill="#ffffff"/>

  <!-- Title -->
  <text x="70" y="52" font-size="32" font-weight="700" fill="#0f172a">AI Slop Detector, system architecture</text>
  <text x="70" y="86" font-size="17" fill="#475569">Slop detection and the local cleaner run entirely in the browser. The backend exists only for the watermark tools and the optional model rewrite.</text>

  <!-- ===================== TIER 1: BROWSER ===================== -->
  <rect x="70" y="112" width="1360" height="368" rx="16" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="96" y="150" font-size="21" font-weight="700" fill="#3730a3">BROWSER</text>
  <text x="205" y="150" font-size="15" fill="#6366f1">no API key  ·  detection needs no network</text>

  <!-- Detector card -->
  <rect x="96" y="168" width="792" height="292" rx="12" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="118" y="200" font-size="18" font-weight="700" fill="#312e81">AI Slop Detector  (script.js)</text>

  <rect x="118" y="216" width="262" height="34" rx="17" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1.5"/>
  <text x="249" y="238" font-size="14.5" font-weight="600" fill="#3730a3" text-anchor="middle">Auto-detect: text or code</text>

  <!-- Text axes -->
  <rect x="118" y="266" width="360" height="176" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="136" y="294" font-size="16" font-weight="700" fill="#0f172a">Text  ·  5 axes</text>
  <text x="136" y="322" font-size="14.5" fill="#334155">Phrasing</text>
  <text x="136" y="346" font-size="14.5" fill="#334155">Structure</text>
  <text x="136" y="370" font-size="14.5" fill="#334155">Rhythm</text>
  <text x="136" y="394" font-size="14.5" fill="#334155">Substance</text>
  <text x="136" y="418" font-size="14.5" fill="#334155">Vocabulary</text>

  <!-- Code axes -->
  <rect x="500" y="266" width="366" height="108" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="518" y="294" font-size="16" font-weight="700" fill="#0f172a">Code  ·  4 axes</text>
  <text x="518" y="322" font-size="14.5" fill="#334155">Lies   ·   Noise</text>
  <text x="518" y="348" font-size="14.5" fill="#334155">Soul   ·   Structure</text>

  <!-- Cleaner -->
  <rect x="500" y="388" width="366" height="54" rx="10" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="518" y="411" font-size="14.5" font-weight="700" fill="#0e7490">Cleaner + guardrail</text>
  <text x="518" y="431" font-size="13" fill="#155e75">re-scores the draft, never returns worse</text>

  <!-- Right column: watermark UI + model settings + badge -->
  <rect x="912" y="168" width="496" height="120" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="934" y="200" font-size="18" font-weight="700" fill="#0f172a">Watermark UI  (watermark.js)</text>
  <text x="934" y="228" font-size="14.5" fill="#334155">base64-encode text or file</text>
  <text x="934" y="252" font-size="14.5" fill="#334155">call the API, preview the cleaned result</text>

  <rect x="912" y="304" width="496" height="66" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="934" y="332" font-size="16" font-weight="700" fill="#6b21a8">model-settings.js</text>
  <text x="934" y="356" font-size="13.5" fill="#7e22ce">provider / key / endpoint, stored in your browser</text>

  <rect x="912" y="388" width="496" height="54" rx="10" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="1160" y="420" font-size="14.5" font-weight="600" fill="#047857" text-anchor="middle">Slop scoring and the local cleaner never leave this box.</text>

  <!-- ===================== spine arrows tier1 -> tier2 ===================== -->
  <!-- watermark UI -> backend (solid) -->
  <line x1="1160" y1="442" x2="1160" y2="600" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="905" y="500" width="330" height="44" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1070" y="520" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">POST /api/inspect</text>
  <text x="1070" y="537" font-size="13.5" font-weight="600" fill="#334155" text-anchor="middle">POST /api/clean</text>

  <!-- cleaner -> backend (optional, dashed) -->
  <line x1="620" y1="442" x2="620" y2="600" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowDash)"/>
  <rect x="452" y="504" width="322" height="40" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="613" y="529" font-size="13.5" font-weight="600" fill="#64748b" text-anchor="middle">optional  POST /api/rewrite</text>

  <!-- ===================== TIER 2: BACKEND ===================== -->
  <rect x="70" y="600" width="990" height="150" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="96" y="636" font-size="20" font-weight="700" fill="#9a3412">BACKEND</text>
  <text x="255" y="636" font-size="15" fill="#c2410c">watermark tools and rewrite only</text>

  <rect x="96" y="652" width="450" height="78" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="118" y="682" font-size="16" font-weight="700" fill="#0f172a">Local  ·  server.py</text>
  <text x="118" y="708" font-size="13.5" fill="#334155">serves static files, proxies /api to a subprocess on :8767</text>

  <rect x="576" y="652" width="458" height="78" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="598" y="682" font-size="16" font-weight="700" fill="#0f172a">Vercel  ·  api/*.py</text>
  <text x="598" y="708" font-size="13.5" fill="#334155">serverless functions, call the logic directly (no subprocess)</text>

  <!-- Provider (right) -->
  <rect x="1100" y="600" width="330" height="150" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="1126" y="636" font-size="18" font-weight="700" fill="#5b21b6">Model provider</text>
  <text x="1126" y="660" font-size="13.5" fill="#6d28d9">optional, for /api/rewrite</text>
  <text x="1126" y="690" font-size="13.5" fill="#4c1d95">OpenAI · Anthropic · Google</text>
  <text x="1126" y="712" font-size="13.5" fill="#4c1d95">Ollama · custom endpoint</text>
  <text x="1126" y="734" font-size="13" font-weight="600" fill="#7c3aed">uses your own key</text>

  <!-- backend -> provider (dashed) -->
  <line x1="1060" y1="675" x2="1100" y2="675" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowDash)"/>

  <!-- ===================== spine arrow tier2 -> tier3 ===================== -->
  <line x1="565" y1="750" x2="565" y2="812" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===================== TIER 3: WATERMARK LOGIC ===================== -->
  <rect x="70" y="812" width="990" height="196" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="96" y="848" font-size="20" font-weight="700" fill="#065f46">WATERMARK LOGIC</text>
  <text x="322" y="848" font-size="15" fill="#059669">pure Python standard library, no dependencies</text>

  <rect x="96" y="864" width="196" height="122" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="194" y="892" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="middle">format_dispatch</text>
  <text x="194" y="914" font-size="12.5" fill="#047857" text-anchor="middle">classify_bytes</text>
  <text x="194" y="934" font-size="12" fill="#475569" text-anchor="middle">text / image /</text>
  <text x="194" y="951" font-size="12" fill="#475569" text-anchor="middle">container routing</text>

  <rect x="308" y="864" width="176" height="122" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="396" y="892" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="middle">text_unicode</text>
  <text x="396" y="916" font-size="12.5" fill="#475569" text-anchor="middle">invisible chars,</text>
  <text x="396" y="934" font-size="12.5" fill="#475569" text-anchor="middle">homoglyphs,</text>
  <text x="396" y="952" font-size="12.5" fill="#475569" text-anchor="middle">bidi, tag chars</text>

  <rect x="500" y="864" width="176" height="122" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="588" y="892" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="middle">image_meta</text>
  <text x="588" y="918" font-size="12.5" fill="#475569" text-anchor="middle">C2PA, EXIF, XMP</text>
  <text x="588" y="940" font-size="12.5" fill="#475569" text-anchor="middle">PNG / JPEG / WebP</text>

  <rect x="692" y="864" width="176" height="122" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="780" y="892" font-size="14.5" font-weight="700" fill="#065f46" text-anchor="middle">container_meta</text>
  <text x="780" y="918" font-size="12.5" fill="#475569" text-anchor="middle">doc properties</text>
  <text x="780" y="940" font-size="12.5" fill="#475569" text-anchor="middle">DOCX / SVG / HEIC</text>

  <rect x="884" y="864" width="160" height="122" rx="10" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="964" y="892" font-size="14" font-weight="700" fill="#065f46" text-anchor="middle">score_stylometry</text>
  <text x="964" y="918" font-size="12.5" fill="#475569" text-anchor="middle">phrase markers,</text>
  <text x="964" y="940" font-size="12.5" fill="#475569" text-anchor="middle">sentence CV,</text>
  <text x="964" y="958" font-size="12.5" fill="#475569" text-anchor="middle">MATTR diversity</text>
</svg>
